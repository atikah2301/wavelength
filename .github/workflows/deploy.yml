name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          for f in js/*.js; do
            node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      - name: Decode binary files stored as base64 text
        run: |
          find . -name '*.b64' -not -path './.git/*' | while read -r f; do
            tr -d '\r\n ' < "$f" | base64 -d > "${f%.b64}"
            rm "$f"
          done

      - name: Stamp service worker cache version
        run: sed -i "s/__CACHE_VERSION__/${{ github.sha }}/" sw.js

      - name: Stamp deploy version info
        run: |
          sed -i "s/__COMMIT_SHA__/${{ github.sha }}/" js/version.js
          sed -i "s/__DEPLOY_TIME__/$(date -u +'%Y-%m-%d %H:%M UTC')/" js/version.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
